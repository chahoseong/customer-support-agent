[project]
name = "customer-support-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.26.0",
    "openai>=3.3.0",
    "pydantic>=2.13.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "RUF",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
pretty = true
