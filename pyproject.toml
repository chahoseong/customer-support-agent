[project]
name = "customer-support-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.3.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "RUF",
]
ignore = [
    "E501",
]

[tool.mypy]
python_version = "3.12"
files = ["scripts"]
strict = true
warn_unreachable = true
pretty = true
