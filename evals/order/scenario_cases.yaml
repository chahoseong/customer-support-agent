name: order_scenarios
cases:
  - name: identified_order_status
    inputs:
      user_message: order-003은 지금 어떤 상태인가요?
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-1
      required_tool_uses:
        - tool_name: find_order
          expected_arguments:
            order_id: order-003
          expected_outcome: success
      forbidden_tools:
        - get_customer_orders
        - find_shipment
        - get_cancellation_policy
      required_tool_sequence: []
      required_response_criteria:
        - id: states_order_status_delivered
          statement: The response states that the order status is delivered.
        - id: identifies_order_as_order_003
          statement: The response identifies the order as order-003.
      forbidden_response_criteria:
        - id: states_order_facts_other_than_id_and_status
          statement: The response states an order-003 fact other than its order ID and delivered status.
        - id: states_shipment_facts
          statement: The response states shipment facts.
        - id: states_cancellation_policy_facts
          statement: The response states cancellation-policy facts.

  - name: shipment_before_carrier_handoff
    inputs:
      user_message: order-001은 아직 배송 시작 안 했나요?
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-2
      required_tool_uses:
        - tool_name: find_order
          expected_arguments:
            order_id: order-001
          expected_outcome: success
      forbidden_tools:
        - get_customer_orders
        - find_shipment
        - get_cancellation_policy
      required_tool_sequence: []
      required_response_criteria:
        - id: states_order_status_processing
          statement: The response states that the order status is processing.
        - id: states_order_001_not_handed_off_to_carrier
          statement: The response states that order-001 has not yet been handed off to a carrier.
      forbidden_response_criteria:
        - id: states_carrier_name
          statement: The response states a carrier name.
        - id: states_shipment_status_beyond_not_handed_off
          statement: The response states a shipment status for order-001 other than that it has not yet been handed off to a carrier.
        - id: states_shipment_location
          statement: The response states a shipment location.
        - id: states_estimated_delivery_date
          statement: The response states an estimated delivery date.
        - id: claims_shipment_information_retrieved
          statement: The response claims that shipment information was retrieved.

  - name: shipment_after_carrier_handoff
    inputs:
      user_message: order-002는 지금 어디쯤 왔나요?
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-3
      required_tool_uses:
        - tool_name: find_order
          expected_arguments:
            order_id: order-002
          expected_outcome: success
        - tool_name: find_shipment
          expected_arguments:
            order_id: order-002
          expected_outcome: success
      forbidden_tools:
        - get_customer_orders
        - get_cancellation_policy
      required_tool_sequence:
        - find_order
        - find_shipment
      required_response_criteria:
        - id: states_order_status_shipped
          statement: The response states that the order status is shipped.
        - id: states_shipment_status_out_for_delivery
          statement: The response states that the shipment status is out_for_delivery.
        - id: distinguishes_order_status_from_shipment_status
          statement: The response distinguishes the order status from the shipment status.
      forbidden_response_criteria:
        - id: states_carrier_name
          statement: The response states a carrier name.
        - id: states_shipment_location
          statement: The response states a shipment location.
        - id: states_tracking_number
          statement: The response states a tracking number.
        - id: states_estimated_delivery_date
          statement: The response states an estimated delivery date.

  - name: cancellable_order
    inputs:
      user_message: order-001을 취소할 수 있나요?
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-4
      required_tool_uses:
        - tool_name: find_order
          expected_arguments:
            order_id: order-001
          expected_outcome: success
        - tool_name: get_cancellation_policy
          expected_arguments: {}
          expected_outcome: success
      forbidden_tools:
        - get_customer_orders
        - find_shipment
      required_tool_sequence: []
      required_response_criteria:
        - id: states_order_status_processing
          statement: The response states that the order status is processing.
        - id: states_policy_permits_cancellation_while_processing
          statement: The response states that the cancellation policy permits cancellation while an order is processing.
        - id: states_order_001_can_be_cancelled
          statement: The response states that order-001 can be cancelled under the current policy.
      forbidden_response_criteria:
        - id: claims_order_001_was_cancelled
          statement: The response claims that order-001 was cancelled.
        - id: claims_cancellation_request_was_accepted
          statement: The response claims that a cancellation request for order-001 was accepted.

  - name: non_cancellable_order
    inputs:
      user_message: order-002를 취소할 수 있는지 알려주세요.
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-5
      required_tool_uses:
        - tool_name: find_order
          expected_arguments:
            order_id: order-002
          expected_outcome: success
        - tool_name: get_cancellation_policy
          expected_arguments: {}
          expected_outcome: success
      forbidden_tools:
        - get_customer_orders
        - find_shipment
      required_tool_sequence: []
      required_response_criteria:
        - id: states_order_status_shipped
          statement: The response states that the order status is shipped.
        - id: states_policy_permits_cancellation_only_while_processing
          statement: The response states that the cancellation policy permits cancellation only while an order is processing.
        - id: states_order_002_cannot_be_cancelled
          statement: The response states that order-002 cannot be cancelled under the current policy.
      forbidden_response_criteria:
        - id: states_cancellation_restriction_reason_beyond_status_and_policy
          statement: The response states a reason why order-002 cannot be cancelled other than its shipped status and the policy that permits cancellation only while processing.
        - id: claims_order_002_was_cancelled
          statement: The response claims that order-002 was cancelled.
        - id: claims_order_002_was_modified
          statement: The response claims that order-002 was modified.

  - name: missing_order_identifier
    inputs:
      user_message: 제 주문은 지금 어디에 있나요?
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-6
      required_tool_uses:
        - tool_name: get_customer_orders
          expected_arguments: {}
          expected_outcome: success
      forbidden_tools:
        - find_order
        - find_shipment
        - get_cancellation_policy
      required_tool_sequence: []
      required_response_criteria:
        - id: presents_available_order_candidates
          statement: The response presents order-001, order-002, and order-003 as the available order candidates.
        - id: asks_customer_to_select_order
          statement: The response asks the customer to select an order.
      forbidden_response_criteria:
        - id: selects_order_for_customer
          statement: The response selects an order for the customer.
        - id: states_order_product_details
          statement: The response states product details for an order.
        - id: states_order_placement_time
          statement: The response states when an order was placed.
        - id: states_order_identifying_information_other_than_available_ids
          statement: The response states order-identifying information other than the IDs order-001, order-002, and order-003.

  - name: unsupported_order_qualifier
    inputs:
      user_message: 최근 주문은 지금 어떻게 되고 있나요?
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-7
      required_tool_uses:
        - tool_name: get_customer_orders
          expected_arguments: {}
          expected_outcome: success
      forbidden_tools:
        - find_order
        - find_shipment
        - get_cancellation_policy
      required_tool_sequence: []
      required_response_criteria:
        - id: states_most_recent_order_cannot_be_identified
          statement: The response states that the available information cannot identify the most recent order.
        - id: presents_available_order_candidates
          statement: The response presents order-001, order-002, and order-003 as the available order candidates.
        - id: asks_customer_to_select_order
          statement: The response asks the customer to select an order.
      forbidden_response_criteria:
        - id: identifies_most_recent_order
          statement: The response states which order is the most recent.
        - id: selects_order_for_customer
          statement: The response selects an order for the customer.

  - name: unknown_order
    inputs:
      user_message: order-999를 조회해주세요.
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-8
      required_tool_uses:
        - tool_name: find_order
          expected_arguments:
            order_id: order-999
          expected_outcome: order_not_found
      forbidden_tools:
        - get_customer_orders
        - find_shipment
        - get_cancellation_policy
      required_tool_sequence: []
      required_response_criteria:
        - id: states_order_not_found_in_customer_context
          statement: The response states that the requested order cannot be found in the current customer context.
      forbidden_response_criteria:
        - id: states_requested_order_facts
          statement: The response states facts about the requested order.
        - id: states_or_implies_order_belongs_to_another_customer
          statement: The response states or implies that the requested order belongs to another customer.
        - id: states_or_implies_order_exists_outside_customer_context
          statement: The response states or implies that the requested order exists outside the current customer context.

  - name: other_customer_order
    inputs:
      user_message: order-004를 조회해주세요.
      customer_id: customer-001
      execution_condition: default
    metadata:
      scenario_id: scenario-8
      required_tool_uses:
        - tool_name: find_order
          expected_arguments:
            order_id: order-004
          expected_outcome: order_not_found
      forbidden_tools:
        - get_customer_orders
        - find_shipment
        - get_cancellation_policy
      required_tool_sequence: []
      required_response_criteria:
        - id: states_order_not_found_in_customer_context
          statement: The response states that the requested order cannot be found in the current customer context.
      forbidden_response_criteria:
        - id: states_requested_order_facts
          statement: The response states facts about the requested order.
        - id: states_or_implies_order_belongs_to_another_customer
          statement: The response states or implies that the requested order belongs to another customer.
        - id: states_or_implies_order_exists_outside_customer_context
          statement: The response states or implies that the requested order exists outside the current customer context.

  - name: shipment_information_failure
    inputs:
      user_message: order-002는 지금 어디쯤 왔나요?
      customer_id: customer-001
      execution_condition: shipment_information_failure
    metadata:
      scenario_id: scenario-9
      required_tool_uses:
        - tool_name: find_order
          expected_arguments:
            order_id: order-002
          expected_outcome: success
        - tool_name: find_shipment
          expected_arguments:
            order_id: order-002
          expected_outcome: tool_execution_failed
      forbidden_tools:
        - get_customer_orders
        - get_cancellation_policy
      required_tool_sequence:
        - find_order
        - find_shipment
      required_response_criteria:
        - id: states_confirmed_order_status_shipped
          statement: The response states that the confirmed order status is shipped.
        - id: states_shipment_progress_could_not_be_confirmed
          statement: The response states that the detailed shipment progress could not be confirmed.
        - id: distinguishes_confirmed_order_status_from_unavailable_shipment_details
          statement: The response distinguishes the confirmed order status from the unavailable shipment details.
      forbidden_response_criteria:
        - id: states_shipment_status_out_for_delivery
          statement: The response states that the shipment status is out_for_delivery.
        - id: states_carrier_name
          statement: The response states a carrier name.
        - id: states_shipment_location
          statement: The response states a shipment location.
        - id: states_tracking_number
          statement: The response states a tracking number.
        - id: states_estimated_delivery_date
          statement: The response states an estimated delivery date.
